name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Weekly, so drift against the pinned LDM and Liferay releases shows up
  # even when nothing is merged here. Mondays 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    name: Run LDM Samples Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The DXP image is ~5GB; reclaim toolchains this job never uses first.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Execute E2E Tests
        run: ./tools/run-e2e.sh
