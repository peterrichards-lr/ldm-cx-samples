name: LDM Package Release (.ldmp)

# Releases are cut by pushing a `v*` tag. Merging to main does NOT release:
# LDM downloads releases/latest directly, so publishing has to be deliberate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Git tag to rebuild and re-attach the .ldmp to (e.g. v1.3.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package LDM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On workflow_dispatch, package the tagged commit, not the branch
          # the dispatch was started from.
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client extensions
        run: ./gradlew clean build

      # The DXP image is ~5GB; reclaim toolchains this job never uses first.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # Builds with `ldm package --stateless` on the LDM release pinned in
      # scripts/lib/ldm.sh. The activation key is for this CI boot only; LDM
      # strips licences from the package (LDM-#2443).
      - name: Build LDM Package
        env:
          LIFERAY_ACTIVATION_KEY_XML: ${{ secrets.LIFERAY_ACTIVATION_KEY_XML }}
        run: |
          docker network create liferay-net || true
          ./scripts/build-ldmp.sh

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ldm-cx-samples.ldmp
            ldm-cx-samples.ldmp.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
