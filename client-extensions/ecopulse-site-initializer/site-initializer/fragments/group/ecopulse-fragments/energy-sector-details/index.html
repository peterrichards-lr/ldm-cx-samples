<div class="energy-sector-details container my-5 p-5 bg-light rounded-lg shadow">
	<div class="row">
		<div class="col-lg-8">
			<h2 class="display-4 text-navy">${configuration.sectorName}</h2>
			<p class="lead text-muted">Operational Status: <span class="badge badge-pill badge-primary">${configuration.status}</span></p>
			<hr class="my-4">
			<p>Welcome to the detailed view of the ${configuration.sectorName} energy grid. This sector is currently operating at <strong class="text-innovation">${configuration.currentLoad}% capacity</strong>.</p>
		</div>
		<div class="col-lg-4 text-center d-flex flex-column justify-content-center">
			<div class="load-indicator py-4 px-2 rounded-circle border border-primary mx-auto" style="width: 150px; height: 150px;">
				<h3 class="m-0">${configuration.currentLoad}%</h3>
				<small class="text-uppercase font-weight-bold">Grid Load</small>
			</div>
		</div>
	</div>
</div>
